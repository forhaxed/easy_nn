[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easy_nn"
version = "0.1.0"
description = "Train anything, anywhere: local brain, remote executor."
requires-python = ">=3.10"
dependencies = [
    "torch",
    "accelerate",
    "cloudpickle",
    "tqdm",
    "colorama",
    "tensorboard",
]

[project.optional-dependencies]
compress = ["zstandard"]

[project.scripts]
easy-nn-server = "easy_nn.server.app:main"

[tool.setuptools.packages.find]
include = ["easy_nn*"]
